name: syncsus-loadtest

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sync_sus
      MYSQL_USER: sync_sus
      MYSQL_PASSWORD: LoadTest123!
      MYSQL_ROOT_PASSWORD: LoadTestRoot123!
      TZ: UTC
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
      - "--max-connections=300"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    networks: [backend]

  app:
    image: sync-sus-app:local
    env_file: .env.loadtest
    volumes:
      - private-files:/var/www/html/storage/app/private
      - app-logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend, backend]

  nginx:
    image: sync-sus-web:local
    ports:
      - "127.0.0.1:18099:80"
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]

  queue-worker:
    image: sync-sus-app:local
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    env_file: .env.loadtest
    volumes:
      - private-files:/var/www/html/storage/app/private
      - app-logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

  scheduler:
    image: sync-sus-app:local
    command: ["php", "artisan", "schedule:work"]
    env_file: .env.loadtest
    volumes:
      - private-files:/var/www/html/storage/app/private
      - app-logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

volumes:
  mysql-data:
  private-files:
  app-logs:

networks:
  frontend:
  backend:
    internal: true
