[www]
# Dimensionado para container de 8 vCPU / 16GB dedicado ao app (Laravel + opcache
# 128MB compartilhado, ~80MB por worker em uso normal, ~1GB reservado para SO/nginx).
# Reavalie via /fpm-status se a RAM real do host divergir deste perfil.
pm = dynamic
pm.max_children = 130
pm.start_servers = 26
pm.min_spare_servers = 16
pm.max_spare_servers = 40
pm.max_requests = 500
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
request_terminate_timeout = 120s
