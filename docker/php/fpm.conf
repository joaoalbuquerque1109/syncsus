[www]
; Dimensionado para o container real de produção no Railway Pro: 24 vCPU / 24GB
; dedicados ao app (confirmado via `railway metrics`), não os 8 vCPU / 16GB do
; perfil anterior — aquele valor subestimava a instância real em ~3x. Orçamento:
; ~80MB por worker em uso normal, 128MB de opcache compartilhado, ~1GB reservado
; para SO/nginx. Reavalie via /fpm-status se a RAM real do host divergir disto.
pm = dynamic
pm.max_children = 250
pm.start_servers = 50
pm.min_spare_servers = 30
pm.max_spare_servers = 75
pm.max_requests = 500
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
request_terminate_timeout = 120s
