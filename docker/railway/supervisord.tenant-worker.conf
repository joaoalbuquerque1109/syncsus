[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:queue-worker]
command=php /var/www/html/artisan queue:work --queue=tenant-provisioning --sleep=2 --tries=1 --timeout=120
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
