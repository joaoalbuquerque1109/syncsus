name: sync-sus

services:
  nginx:
    image: sync-sus-web:local
    build:
      context: .
      target: web
    ports:
      - "${SYNC_SUS_HTTP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  app:
    image: sync-sus-app:local
    build:
      context: .
      target: app
    env_file: .env
    volumes:
      - private-files:/var/www/html/storage/app/private
      - backups:/backups:ro
      - app-logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/www/html/storage/framework:uid=82,gid=82,mode=0770
      - /var/www/html/bootstrap/cache:uid=82,gid=82,mode=0770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  queue-worker:
    image: sync-sus-app:local
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    env_file: .env
    volumes:
      - private-files:/var/www/html/storage/app/private
      - app-logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/www/html/storage/framework:uid=82,gid=82,mode=0770
      - /var/www/html/bootstrap/cache:uid=82,gid=82,mode=0770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  scheduler:
    image: sync-sus-app:local
    command: ["php", "artisan", "schedule:work"]
    env_file: .env
    volumes:
      - private-files:/var/www/html/storage/app/private
      - app-logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/www/html/storage/framework:uid=82,gid=82,mode=0770
      - /var/www/html/bootstrap/cache:uid=82,gid=82,mode=0770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backup:
    image: sync-sus-backup:local
    build:
      context: .
      target: backup
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_RETENTION_DAYS: ${SYNC_SUS_BACKUP_RETENTION_DAYS:-14}
      BACKUP_REQUIRE_ENCRYPTION: ${SYNC_SUS_BACKUP_REQUIRE_ENCRYPTION:-false}
      BACKUP_ENCRYPTION_KEY_FILE: ${SYNC_SUS_BACKUP_ENCRYPTION_KEY_FILE:-}
    volumes:
      - private-files:/private-files:ro
      - backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  mysql-data:
  private-files:
  backups:
  app-logs:

networks:
  frontend:
  backend:
    internal: true
